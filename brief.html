<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 한 일 정리 · 옆커폰 대구지사</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1c2430; --muted:#5b6875;
    --line:#e4e7ec; --red:#c0392b; --redbg:#fdecea; --amber:#b7791f;
    --amberbg:#fdf3e2; --green:#2e7d52; --greenbg:#e8f5ee; --blue:#2f6db3;
    --bluebg:#e8f0f9; --purple:#6B3FA8; --purplebg:#f1ebfa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:18px 14px 48px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
  .back{font-size:13px;color:var(--purple);text-decoration:none;font-weight:700}
  .btn{font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:20px;
    padding:7px 14px;cursor:pointer;color:var(--ink);font-weight:600}
  .btn:active{background:#eef1f4}
  .btn[disabled]{opacity:.55}
  .head{margin-bottom:12px}
  .kicker{font-size:12.5px;color:var(--muted);font-weight:600}
  .title{font-size:23px;font-weight:800;margin:2px 0 5px}
  .stamp{font-size:12.5px;color:var(--muted)}
  .stamp b{color:var(--ink)}

  .make{display:flex;gap:8px;margin:14px 0 16px}
  .make button{flex:1;font-size:15px;font-weight:800;border:none;border-radius:14px;
    padding:15px 12px;cursor:pointer;background:var(--purple);color:#fff;
    box-shadow:0 3px 10px rgba(107,63,168,.25)}
  .make button:active{transform:translateY(1px)}
  .make button.sec{flex:0 0 40%;background:#fff;color:var(--ink);
    border:1px solid var(--line);box-shadow:none;font-size:13.5px}
  .make button[disabled]{opacity:.6;cursor:default}

  .summary{background:var(--ink);color:#fff;border-radius:14px;padding:15px 16px;margin:0 0 16px}
  .srow{display:flex;gap:8px}
  .sbox{flex:1;text-align:center;padding:4px 2px}
  .sbox b{display:block;font-size:22px;font-weight:800;line-height:1.2}
  .sbox span{font-size:11.5px;color:#c2ccd6}
  .sbox.hot b{color:#ff9a8f}
  .sbox.ok b{color:#8fe0b4}
  .sline{margin:10px 0 0;font-size:13px;color:#d3dae2;border-top:1px solid #38424e;padding-top:9px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:13px}
  .card.hi{border-color:#cdb6ee;box-shadow:0 0 0 3px var(--purplebg)}
  .card h2{font-size:14.5px;margin:0 0 10px;display:flex;align-items:center;gap:7px;font-weight:800}
  .card h2 .n{font-size:12px;color:var(--muted);font-weight:600}
  .item{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
  .item:first-of-type{border-top:none}
  .tag{flex:none;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;white-space:nowrap;margin-top:2px}
  .tag.red{background:var(--redbg);color:var(--red)}
  .tag.amber{background:var(--amberbg);color:var(--amber)}
  .tag.green{background:var(--greenbg);color:var(--green)}
  .tag.blue{background:var(--bluebg);color:var(--blue)}
  .tag.gray{background:#eef1f4;color:var(--muted)}
  .itxt{font-size:13.5px;min-width:0;flex:1}
  .itxt .st{font-weight:800}
  .itxt .sub{color:var(--muted);font-size:12px;margin-top:1px}
  .due{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:5px;white-space:nowrap}
  .due.over{background:var(--redbg);color:var(--red)}
  .due.today{background:var(--amberbg);color:var(--amber)}
  .due.soon{background:var(--bluebg);color:var(--blue)}

  details.card > summary{list-style:none;cursor:pointer;font-size:14.5px;font-weight:800;
    display:flex;align-items:center;gap:7px}
  details.card > summary::-webkit-details-marker{display:none}
  details.card > summary .n{font-size:12px;color:var(--muted);font-weight:600}
  details.card > summary::after{content:"펼치기 ▾";margin-left:auto;font-size:11.5px;color:var(--purple);font-weight:700}
  details.card[open] > summary::after{content:"접기 ▴"}
  details.card[open] > summary{margin-bottom:8px}

  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
  th,td{text-align:center;padding:7px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:700;font-size:11.5px;background:#fafbfc}
  td.store{text-align:left;font-weight:800}
  td.store small{display:block;font-weight:500;color:var(--muted);font-size:10.5px}
  .no{color:var(--red);font-weight:800}
  .warn{color:var(--amber);font-weight:800}
  .ok{color:var(--green);font-weight:800}
  .mut{color:var(--muted)}
  .memo{white-space:pre-wrap;font-size:13.5px;background:#fafbfc;border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;margin:0}
  .empty{font-size:13px;color:var(--muted);padding:6px 0}
  .hint{background:var(--purplebg);border:1px solid #ddd0f2;border-radius:12px;
    padding:11px 13px;font-size:12.5px;color:#4a2c76;margin-bottom:13px;line-height:1.65}
  .hint b{color:var(--purple)}
  .foot{font-size:11.5px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);
    color:#fff;font-size:13px;padding:10px 18px;border-radius:24px;opacity:0;
    transition:opacity .25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="back" href="index.html">← 홈</a>
    <a class="back" href="sv.html" style="color:var(--muted)">직영매장 관리 →</a>
  </div>

  <div class="head">
    <div class="kicker">📝 옆커폰 대구지사 · 백지현 SV</div>
    <div class="title">오늘 한 일 정리</div>
    <div class="stamp" id="stamp">불러오는 중…</div>
  </div>

  <div class="make">
    <button id="btnMake">📝 보고서 만들기</button>
    <button class="sec" id="btnCopy">복사</button>
  </div>

  <div id="app"></div>

  <div class="foot">
    <b>직영매장 관리</b>에 입력·체크한 내용만으로 그 자리에서 정리합니다.<br>
    일 끝내고 매장 관리에서 <b>완료 체크</b>만 눌러두면, 여기서 그날 한 일이 자동으로 잡힙니다.
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SB_URL = "https://skhbcizzqgmlnwiwlaxt.supabase.co";
const SB_KEY = "sb_publishable_ZJxHaQ8PwdiY8ZWYqXCReg_E5RqrV62";
const H = {"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};

let B = null;

const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => (v===null||v===undefined||v==="") ? null : (typeof v==="number"?v:(isNaN(+v)?null:+v));
const fmt = v => v===null?"—":v.toLocaleString("ko-KR");
const todayStr = () => {
  const d = new Date(Date.now() + (new Date().getTimezoneOffset()*60000) + 9*3600000);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
};
const DOW = ["일","월","화","수","목","금","토"];
function korDate(s){
  if(!s) return "";
  const [y,m,d] = s.split("-").map(Number);
  return `${y}년 ${m}월 ${d}일 (${DOW[new Date(Date.UTC(y,m-1,d)).getUTCDay()]})`;
}
function md(s){ if(!s) return ""; const p=String(s).split("-"); return p.length<3?s:p[1]+"/"+p[2]; }

// 「→ 08/21」 같은 기한 표기와 🔴 표시는 본문에서 떼어내 칩으로 따로 보여준다
function clean(t){
  return String(t||"").replace(/🔴/g,"")
    .replace(/\s*→\s*\d{1,2}\s*\/\s*\d{1,2}\s*$/,"").trim();
}
function dueChip(due){
  if(!due) return "";
  const t = todayStr();
  const cls = due < t ? "over" : (due === t ? "today" : "soon");
  const lbl = due < t ? "기한 지남 "+md(due) : (due===t ? "오늘 "+md(due) : md(due)+" 까지");
  return `<span class="due ${cls}">${lbl}</span>`;
}
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("on"), 2200);
}

async function fetchSnapshot(){
  const r = await fetch(`${SB_URL}/rest/v1/kv?namespace=eq.briefing&key=eq.sv_today&select=value`,{headers:H});
  const j = await r.json();
  if(!j || !j.length) return null;
  return JSON.parse(j[0].value);
}
async function rebuild(){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/sv_build_brief`,{method:"POST",headers:H,body:"{}"});
  if(!r.ok) throw new Error(await r.text());
  return await r.json();
}

/* ---------- 렌더 ---------- */
function listCard(title, dot, arr, opt={}){
  if(!arr || !arr.length){
    if(opt.hideEmpty) return "";
    return `<div class="card${opt.hi?" hi":""}"><h2>${dot} ${title}</h2><div class="empty">${opt.emptyText||"없습니다."}</div></div>`;
  }
  const rows = arr.map(it=>`<div class="item">
      <span class="tag ${opt.tag?opt.tag(it):"gray"}">${esc(opt.tagText?opt.tagText(it):(it.group||""))}</span>
      <div class="itxt">
        <div><span class="st">${esc(it.store)}</span> · ${esc(clean(it.text))}${opt.noDue?"":dueChip(it.due)}</div>
        ${opt.sub?`<div class="sub">${esc(opt.sub(it))}</div>`:""}
      </div></div>`).join("");
  return `<div class="card${opt.hi?" hi":""}"><h2>${dot} ${title} <span class="n">${arr.length}건</span></h2>${rows}</div>`;
}

function render(){
  const t = todayStr();
  const s = B.summary||{};
  const doneT = B.doneToday||[];
  const doneY = B.doneYesterday||[];
  const urgent = (B.urgent||[]).slice().sort((a,b)=>{
    const av=a.due||"9999-99-99", bv=b.due||"9999-99-99";
    if(av!==bv) return av<bv?-1:1;
    return (b.red?1:0)-(a.red?1:0);
  });
  const soon = B.soon||[];
  const openAll = B.open||[];
  const alerts = (B.alerts||[]).slice().sort((a,b)=>(a.level==="red"?0:1)-(b.level==="red"?0:1));

  document.getElementById("stamp").innerHTML =
    `<b>${korDate(B.date)}</b> · 정리 시각 ${esc((B.generatedAt||"").replace("T"," ").slice(11,16))}` +
    ` · 매장 데이터 최종 수정 ${esc(B.dataUpdatedAt||"—")}` +
    (B.date !== t ? ` <span style="color:var(--red);font-weight:800">· 오늘 날짜가 아닙니다</span>` : "");

  let h = "";

  h += `<div class="summary">
    <div class="srow">
      <div class="sbox ok"><b>${doneT.length}</b><span>오늘 완료</span></div>
      <div class="sbox hot"><b>${s.urgent||0}</b><span>아직 남은 것</span></div>
      <div class="sbox"><b>${s.alerts||0}</b><span>광고 경고</span></div>
      <div class="sbox"><b>${s.open||0}</b><span>진행중 전체</span></div>
    </div>
    <p class="sline">${
      doneT.length===0
        ? "오늘 완료로 체크된 건이 아직 없습니다. <b>직영매장 관리</b>에서 끝낸 일을 완료로 바꾸고 다시 눌러주세요."
        : `오늘 <b>${new Set(doneT.map(x=>x.store)).size}개 매장</b>에서 <b>${doneT.length}건</b>을 처리했습니다.` +
          ((s.urgent||0)>0 ? ` 기한이 걸린 <b>${s.urgent}건</b>이 아직 남아 있습니다.` : " 기한이 걸린 남은 건은 없습니다.")
    }</p>
  </div>`;

  h += `<div class="hint">아래 <b>「오늘 처리한 일」</b>이 보고서 본문이 되고, <b>「아직 남은 것 · 진행중」</b>이 ‘완료 시까지 계속 보고’ 항목이 됩니다.
    <b>복사</b> 버튼을 누른 뒤 클로드에 붙여넣고 “오늘 보고서” 라고만 하면 됩니다.</div>`;

  h += listCard("오늘 처리한 일 — 보고서 본문", "✅", doneT, {
    hi:true, noDue:true, tag:()=>"green", tagText:()=>"완료",
    sub: it => `${it.group||""} · ${it.manager||""}`,
    emptyText:"오늘 완료로 체크된 건이 없습니다. 직영매장 관리에서 완료 체크 후 다시 눌러주세요."
  });

  h += listCard("아직 안 끝난 것 — 기한 걸림", "🔴", urgent, {
    tag: it => (it.due && it.due < t) ? "red" : "amber",
    tagText: it => it.why || "긴급",
    sub: it => `${it.group||""} · ${it.manager||""}`,
    emptyText:"기한이 지났거나 오늘 마감인 건은 없습니다."
  });

  h += listCard("3일 안에 마감", "🟡", soon, {
    hideEmpty:true, tag:()=>"blue", tagText: it=>it.group||"",
    sub: it => it.manager||""
  });

  if(alerts.length){
    h += `<div class="card"><h2>📡 광고 · 온라인 경고 <span class="n">${alerts.length}건</span></h2>` +
      alerts.map(a=>`<div class="item">
        <span class="tag ${a.level==="red"?"red":"amber"}">${esc(a.type)}</span>
        <div class="itxt"><div><span class="st">${esc(a.store)}</span> · ${esc(a.text)}</div></div>
      </div>`).join("") + `</div>`;
  }

  if(openAll.length){
    h += `<details class="card"><summary>📌 진행중 전체 — 완료 시까지 계속 보고 <span class="n">${openAll.length}건</span></summary>` +
      openAll.slice().sort((a,b)=>(a.due||"9999")<(b.due||"9999")?-1:1).map(it=>`<div class="item">
        <span class="tag gray">${esc(it.group||"")}</span>
        <div class="itxt"><div><span class="st">${esc(it.store)}</span> · ${esc(clean(it.text))}${dueChip(it.due)}</div>
        <div class="sub">${esc(it.manager||"")}</div></div>
      </div>`).join("") + `</details>`;
  }

  if(doneY.length){
    h += `<details class="card"><summary>🕘 어제(${md(B.date)===md(todayStr())?"전일":"전일"}) 완료 <span class="n">${doneY.length}건</span></summary>` +
      doneY.map(it=>`<div class="item">
        <span class="tag green">${esc(md(it.doneAt))}</span>
        <div class="itxt"><div><span class="st">${esc(it.store)}</span> · ${esc(clean(it.text))}</div>
        <div class="sub">${esc(it.group||"")} · ${esc(it.manager||"")}</div></div>
      </div>`).join("") + `</details>`;
  }

  const st = B.stores||[];
  h += `<details class="card"><summary>🏪 매장별 지표 <span class="n">${st.length}개 매장</span></summary>
    <div class="tblwrap"><table>
      <thead><tr><th style="text-align:left">매장</th><th>순위</th><th>블로그</th><th>리뷰</th>
      <th>플친</th><th>비즈머니</th><th>광고</th><th>진행중</th></tr></thead><tbody>` +
    st.map(x=>{
      const bz = num(x.bizmoney);
      const bzc = bz===null ? "mut" : (bz<0 ? "no" : (bz<10000 ? "warn" : ""));
      const pl = String(x.place||"").toLowerCase(), pw = String(x.power||"").toLowerCase();
      const adOff = (pl==="off"||pl==="x") || (pw==="off"||pw==="x");
      return `<tr>
        <td class="store">${esc(x.name)}<small>${esc(x.group||"")} · ${esc(x.manager||"")}</small></td>
        <td>${x.rank==null?"—":esc(x.rank)+"위"}</td>
        <td>${fmt(num(x.blog))}</td><td>${fmt(num(x.review))}</td><td>${fmt(num(x.plusfriend))}</td>
        <td class="${bzc}">${fmt(bz)}</td>
        <td class="${adOff?"no":"ok"}">${adOff?"OFF":"ON"}</td>
        <td>${x.open?`<b>${x.open}</b>`:'<span class="mut">0</span>'}</td>
      </tr>`;
    }).join("") + `</tbody></table></div></details>`;

  if(B.memo && B.memo.trim()){
    h += `<div class="card"><h2>🗒 전 매장 공통 메모</h2><p class="memo">${esc(B.memo)}</p></div>`;
  }

  document.getElementById("app").innerHTML = h;
}

/* ---------- 보고서 재료 텍스트 ---------- */
function reportText(){
  const L = [];
  const dt = B.doneToday||[], dy = B.doneYesterday||[];
  L.push(`[옆커폰 대구지사 · 백지현 SV] ${B.date} (${korDate(B.date).split(" ").pop()}) 일일 업무보고 재료`);
  L.push(`직영매장 관리 기준 · 정리 ${B.generatedAt||"-"} · 매장 데이터 최종 수정 ${B.dataUpdatedAt||"-"}`);
  L.push("");
  L.push(`■ 오늘 처리한 일 (${dt.length}건) — 보고서 본문`);
  if(!dt.length) L.push("- (없음)");
  dt.forEach(i=>L.push(`- [${i.store} / ${i.group} / ${i.manager}] ${clean(i.text)}`));
  L.push("");
  L.push(`■ 아직 안 끝난 것 · 기한 걸림 (${(B.urgent||[]).length}건)`);
  (B.urgent||[]).forEach(i=>L.push(`- [${i.store} / ${i.manager}] ${clean(i.text)} / 기한 ${i.due||"미지정"} (${i.why||""})`));
  L.push("");
  L.push(`■ 진행 중 전체 (${(B.open||[]).length}건) — 완료 시까지 계속 보고`);
  (B.open||[]).forEach(i=>L.push(`- [${i.store}] ${clean(i.text)} / 기한 ${i.due||"미지정"}`));
  L.push("");
  L.push(`■ 광고·온라인 경고 (${(B.alerts||[]).length}건)`);
  (B.alerts||[]).forEach(a=>L.push(`- [${a.store}] ${a.type}: ${a.text}`));
  L.push("");
  L.push(`■ 전일 완료 (${dy.length}건) — 전일 건 처리 현황용`);
  dy.forEach(i=>L.push(`- [${i.store}] ${clean(i.text)} (완료 ${i.doneAt})`));
  L.push("");
  L.push("■ 매장별 지표 (순위/블로그/리뷰/플친/비즈머니/진행중)");
  (B.stores||[]).forEach(x=>L.push(
    `- ${x.name}(${x.group}/${x.manager}) 순위 ${x.rank??"-"} / 블로그 ${x.blog??"-"} / 리뷰 ${x.review??"-"} / 플친 ${x.plusfriend??"-"} / 비즈머니 ${x.bizmoney??"-"} / 진행중 ${x.open}건`));
  L.push("");
  L.push("■ 전 매장 공통 메모");
  L.push(B.memo||"(없음)");
  return L.join("\n");
}

/* ---------- 동작 ---------- */
async function make(showToast){
  const b = document.getElementById("btnMake");
  b.disabled = true; b.textContent = "정리 중…";
  try{
    B = await rebuild();
    render();
    if(showToast) toast(`오늘 완료 ${(B.doneToday||[]).length}건으로 정리했습니다`);
  }catch(e){
    document.getElementById("stamp").textContent = "불러오지 못했습니다 — 인터넷을 확인하세요";
    document.getElementById("app").innerHTML =
      `<div class="card"><div class="empty">${esc(String(e.message||e)).slice(0,200)}</div></div>`;
  }
  b.disabled = false; b.textContent = "📝 보고서 만들기";
}

document.getElementById("btnMake").addEventListener("click", ()=>make(true));

document.getElementById("btnCopy").addEventListener("click", async ()=>{
  if(!B){ toast("먼저 「보고서 만들기」를 눌러주세요"); return; }
  const txt = reportText();
  try{ await navigator.clipboard.writeText(txt); toast("복사 완료 — 클로드에 붙여넣으세요"); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=txt;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove(); toast("복사 완료");
  }
});

// 들어오자마자 오늘 기준으로 한 번 정리해서 보여준다
make(false);
</script>
</body>
</html>
