<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 브리핑 · 옆커폰 대구지사</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#1c2430; --muted:#5b6875;
    --line:#e4e7ec; --red:#c0392b; --redbg:#fdecea; --amber:#b7791f;
    --amberbg:#fdf3e2; --green:#2e7d52; --greenbg:#e8f5ee; --blue:#2f6db3;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 40px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .back{font-size:13px;color:var(--blue);text-decoration:none;}
  .refresh{font-size:13px;border:1px solid var(--line);background:#fff;border-radius:20px;
    padding:6px 14px;cursor:pointer;color:var(--ink);}
  .refresh:active{background:#eef1f4;}
  .head{margin-bottom:14px;}
  .kicker{font-size:13px;color:var(--muted);}
  .title{font-size:24px;font-weight:800;margin:2px 0 4px;}
  .date{font-size:14px;color:var(--muted);}
  .summary{background:var(--ink);color:#fff;border-radius:14px;padding:16px 18px;margin:12px 0 18px;}
  .summary b{font-size:17px;}
  .summary p{margin:6px 0 0;font-size:14px;color:#d3dae2;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;}
  .card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .item{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start;}
  .item:first-of-type{border-top:none;}
  .tag{flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;margin-top:1px;}
  .tag.red{background:var(--redbg);color:var(--red);}
  .tag.amber{background:var(--amberbg);color:var(--amber);}
  .tag.green{background:var(--greenbg);color:var(--green);}
  .tag.blue{background:#e8f0f9;color:var(--blue);}
  .itxt{font-size:14px;}
  .itxt .sub{color:var(--muted);font-size:12.5px;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px;}
  th,td{text-align:center;padding:8px 4px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:600;font-size:12px;}
  td.store{text-align:left;font-weight:700;}
  .ok{color:var(--green);font-weight:700;}
  .no{color:var(--red);font-weight:700;}
  .warn{color:var(--amber);font-weight:700;}
  .mut{color:var(--muted);}
  .meter{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 2px;}
  .meter > span{display:block;height:100%;background:var(--blue);transition:width .4s;}
  .foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.7;}
  .state{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}
  .allgood{background:var(--greenbg);color:var(--green);border-radius:14px;padding:18px;text-align:center;font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← 홈으로</a>
    <button class="refresh" onclick="loadBrief()">↻ 새로고침</button>
  </div>
  <div class="head">
    <div class="kicker">옆커폰 · 대구지사 아침 브리핑</div>
    <div class="title">오늘 놓치면 안 되는 것</div>
    <div class="date" id="date">불러오는 중…</div>
  </div>
  <div id="content"><div class="state">데이터를 불러오는 중이에요…</div></div>
  <div class="foot">
    데이터 출처: 옆커폰 업무 통합 관리 (실시간)<br>
    매일 오전 10시 자동 브리핑도 발송돼요
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = "https://skhbcizzqgmlnwiwlaxt.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNraGJjaXp6cWdtbG53aXdsYXh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NjI5NTIsImV4cCI6MjEwMDQzODk1Mn0.Ov_4bLIkkxgRb-UG_qSYl_XNM0BbNESOXJl1dFVLfAo";
const sb = supabase.createClient(SB_URL, SB_KEY);

function kstToday(){
  const f = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'});
  return f.format(new Date()); // YYYY-MM-DD
}
function kstMonday(){
  // 이번 주 월요일 (Asia/Seoul)
  const parts = new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',weekday:'short'}).format(new Date());
  const map={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  const dow = map[parts];
  const diff = (dow===0?6:dow-1);
  const today = kstToday();
  const d = new Date(today+"T00:00:00");
  d.setDate(d.getDate()-diff);
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dateLabel(){
  const wd=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',weekday:'short'}).format(new Date());
  const t=kstToday().split('-');
  return `${t[0]}년 ${Number(t[1])}월 ${Number(t[2])}일 (${wd})`;
}
const looksTest = s => !s || /^(1+|ㅇ+|3+|test|테스트|ㄴ+|ㅁ+)$/i.test(String(s).trim());

async function loadBrief(){
  document.getElementById('date').textContent = dateLabel();
  document.getElementById('content').innerHTML = '<div class="state">데이터를 불러오는 중이에요…</div>';
  const {data, error} = await sb.from('kv').select('namespace,key,value').in('namespace',['sales','handover']);
  if(error){
    document.getElementById('content').innerHTML =
      `<div class="state">데이터를 불러오지 못했어요.<br><span style="font-size:12px">${error.message||error}</span></div>`;
    return;
  }
  const map={}; (data||[]).forEach(r=>{ map[r.namespace+'|'+r.key]=r.value; });
  const parse=(ns,key)=>{ try{return JSON.parse(map[ns+'|'+key]);}catch(e){return null;} };

  const today=kstToday(), monday=kstMonday();
  let stores=parse('sales','stores')||[];

  // 매출 분석
  const rows=[]; const unreported=[], zeroSales=[], noPrice=[], promoShort=[], weekMiss=[];
  stores.forEach(s=>{
    const rep=parse('sales',`report:${s}:${today}`);
    const wk=parse('sales',`week:${s}:${monday}`);
    const reported=!!rep;
    if(!reported) unreported.push(s);
    let sales='–',price='–',promo='–',week='–';
    if(reported){
      sales=rep.sales||0;
      if(sales===0) zeroSales.push(s);
      price=rep.priceSheet||'';
      if(price==='미완료') noPrice.push(s);
      const pd=rep.promoDone||0, pt=rep.promoTarget||0;
      promo=`${pd}/${pt}`;
      if(pt>0 && pd<pt) promoShort.push(`${s} ${pd}/${pt}`);
    }
    if(wk){
      const miss=['mon','wed','fri','sat'].filter(d=>!wk[d]);
      if(miss.length) weekMiss.push(s);
      week = miss.length? '✕':'✓';
    }
    rows.push({s,reported,sales,price,promo,week,hasWeek:!!wk});
  });

  // 인수인계 분석
  const handoverKeys=Object.keys(map).filter(k=>k.startsWith('handover|handover:') && !k.includes('handover_index'));
  const hoItems=[];
  handoverKeys.forEach(k=>{
    const key=k.split('|')[1];
    let obj; try{obj=JSON.parse(map[k]);}catch(e){return;}
    if(!obj||!obj.meta) return;
    const store=obj.meta.store||'(무제)';
    let all=[], pendingIn=0, total=0, done=0;
    const simple=obj.simple||{};
    Object.values(simple).forEach(arr=>{ if(Array.isArray(arr)) all=all.concat(arr); });
    all.forEach(it=>{ total++; if(it.out&&it.in) done++; else if(it.out&&!it.in) pendingIn++; });
    const testish = looksTest(store)||looksTest(obj.meta.outgoing)||looksTest(obj.meta.incoming);
    hoItems.push({store,total,done,pendingIn,notStarted:done===0&&pendingIn===0,testish});
  });

  render({rows,unreported,zeroSales,noPrice,promoShort,weekMiss,stores,hoItems});
}

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function render(d){
  const reportedCount = d.stores.length - d.unreported.length;
  const pct = d.stores.length? Math.round(reportedCount/d.stores.length*100):0;

  // 급한 항목 수 카운트
  const urgent = d.unreported.length + d.zeroSales.length;
  const warn = (d.noPrice.length?1:0)+(d.promoShort.length?1:0)+(d.weekMiss.length?1:0);
  const totalFlags = urgent + d.noPrice.length + d.promoShort.length + (d.weekMiss.length?1:0);

  let html='';

  // 요약
  if(totalFlags===0){
    html += `<div class="allgood">🎉 오늘은 놓친 항목이 없어요! 모든 매장 보고·체크 완료.</div>`;
  }else{
    html += `<div class="summary"><b>오늘 꼭 챙길 것 ${totalFlags}가지</b>
      <p>${d.unreported.length?`매출 미보고 ${d.unreported.length}곳, `:''}${d.zeroSales.length?`매출 0원 ${d.zeroSales.length}곳, `:''}시세표·프로모션·주간 체크를 확인하세요. 아래 🔴부터 처리하시면 돼요.</p></div>`;
  }

  // 매출 보고 현황
  html += `<div class="card"><h2><span class="dot" style="background:var(--blue)"></span>오늘 매출 보고 현황 &nbsp;<span class="mut" style="font-weight:400">${reportedCount} / ${d.stores.length} 매장</span></h2>
    <div class="meter"><span style="width:${pct}%"></span></div>
    <div class="mut" style="font-size:12px">${d.unreported.length? '미보고: '+d.unreported.map(esc).join(', ') : '전 매장 보고 완료'}</div></div>`;

  // 🔴 지금 바로
  let red='';
  if(d.unreported.length) red += `<div class="item"><span class="tag red">미보고</span><div class="itxt"><b>${d.unreported.map(esc).join(' · ')}</b> 오늘 매출 보고가 아직 안 됐어요.<div class="sub">보고 독려 또는 마감 전 직접 확인</div></div></div>`;
  if(d.zeroSales.length) red += `<div class="item"><span class="tag red">매출 0원</span><div class="itxt"><b>${d.zeroSales.map(esc).join(' · ')}</b> 보고는 됐지만 매출이 0원이에요.<div class="sub">실제 무실적인지, 입력 누락인지 확인</div></div></div>`;
  if(red) html += `<div class="card"><h2><span class="dot" style="background:var(--red)"></span>🔴 지금 바로 챙기기</h2>${red}</div>`;

  // 🟡 오늘 중
  let amb='';
  if(d.noPrice.length) amb += `<div class="item"><span class="tag amber">시세표</span><div class="itxt"><b>${d.noPrice.map(esc).join(' · ')}</b> 시세표 미완료<div class="sub">업로드/작성 마무리 필요</div></div></div>`;
  if(d.promoShort.length) amb += `<div class="item"><span class="tag amber">프로모션</span><div class="itxt"><b>${d.promoShort.map(esc).join(' · ')}</b> 목표 대비 진행 부족<div class="sub">오늘 목표 대비 미달</div></div></div>`;
  if(d.weekMiss.length) amb += `<div class="item"><span class="tag amber">주간 광고</span><div class="itxt">이번 주 주간 광고 체크(월·수·금·토) 누락: <b>${d.weekMiss.map(esc).join(' · ')}</b><div class="sub">해당 요일 체크 필요</div></div></div>`;
  if(amb) html += `<div class="card"><h2><span class="dot" style="background:var(--amber)"></span>🟡 오늘 중 확인·완료</h2>${amb}</div>`;

  // 매장별 표
  let tr='';
  d.rows.forEach(r=>{
    const salesCell = !r.reported? '<td class="mut">–</td>' :
      (r.sales===0? '<td class="warn">0원</td>' : `<td>${(r.sales/10000).toLocaleString()}만원</td>`);
    tr += `<tr><td class="store">${esc(r.s)}</td>`+
      (r.reported?'<td class="ok">✓</td>':'<td class="no">미보고</td>')+
      salesCell+
      (!r.reported?'<td class="mut">–</td>':(r.price==='미완료'?'<td class="no">미완료</td>':'<td class="ok">완료</td>'))+
      (!r.reported?'<td class="mut">–</td>':`<td class="${/^0\//.test(r.promo)?'no':'ok'}">${esc(r.promo)}</td>`)+
      (!r.hasWeek?'<td class="mut">–</td>':(r.week==='✕'?'<td class="no">✕</td>':'<td class="ok">✓</td>'))+
      `</tr>`;
  });
  html += `<div class="card"><h2><span class="dot" style="background:var(--blue)"></span>매장별 한눈에</h2>
    <table><thead><tr><th style="text-align:left">매장</th><th>보고</th><th>매출</th><th>시세표</th><th>프로모션</th><th>주간체크</th></tr></thead><tbody>${tr}</tbody></table></div>`;

  // 인수인계
  if(d.hoItems.length){
    let ho='';
    d.hoItems.forEach(h=>{
      if(h.testish){
        ho += `<div class="item"><span class="tag green">정리 권장</span><div class="itxt"><b>'${esc(h.store)}'</b> 테스트로 보이는 항목이에요.<div class="sub">실제 건이 아니면 삭제 권장</div></div></div>`;
      }else if(h.notStarted){
        ho += `<div class="item"><span class="tag blue">진행중</span><div class="itxt"><b>${esc(h.store)}</b> 착수 단계 · 항목 미완료<div class="sub">담당자 지정 후 진행 필요</div></div></div>`;
      }else if(h.pendingIn>0){
        ho += `<div class="item"><span class="tag amber">인수 대기</span><div class="itxt"><b>${esc(h.store)}</b> 완료 ${h.done}/${h.total} · 인수 확인 대기 ${h.pendingIn}건<div class="sub">인수자 확인 체크 필요</div></div></div>`;
      }else{
        ho += `<div class="item"><span class="tag green">진행</span><div class="itxt"><b>${esc(h.store)}</b> 완료 ${h.done}/${h.total}</div></div>`;
      }
    });
    html += `<div class="card"><h2><span class="dot" style="background:var(--green)"></span>인수인계 진행 상황</h2>${ho}</div>`;
  }

  document.getElementById('content').innerHTML = html;
}

loadBrief();
</script>
</body>
</html>
