<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 브리핑 · 옆커폰 대구지사</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#1c2430; --muted:#5b6875;
    --line:#e4e7ec; --red:#c0392b; --redbg:#fdecea; --amber:#b7791f;
    --amberbg:#fdf3e2; --green:#2e7d52; --greenbg:#e8f5ee; --blue:#2f6db3;
    --purple:#6B3FA8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 40px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .back{font-size:13px;color:var(--purple);text-decoration:none;font-weight:700;}
  .refresh{font-size:13px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;color:var(--ink);}
  .refresh:active{background:#eef1f4;}
  .head{margin-bottom:14px;}
  .kicker{font-size:13px;color:var(--muted);}
  .title{font-size:24px;font-weight:800;margin:2px 0 4px;}
  .date{font-size:14px;color:var(--muted);}
  .summary{background:var(--ink);color:#fff;border-radius:14px;padding:16px 18px;margin:12px 0 18px;}
  .summary b{font-size:17px;}
  .summary p{margin:6px 0 0;font-size:14px;color:#d3dae2;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;}
  .card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .item{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start;}
  .item:first-of-type{border-top:none;}
  .tag{flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;margin-top:1px;}
  .tag.red{background:var(--redbg);color:var(--red);}
  .tag.amber{background:var(--amberbg);color:var(--amber);}
  .tag.green{background:var(--greenbg);color:var(--green);}
  .tag.blue{background:#e8f0f9;color:var(--blue);}
  .itxt{font-size:14px;}
  .itxt .sub{color:var(--muted);font-size:12.5px;margin-top:1px;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px;}
  th,td{text-align:center;padding:8px 4px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:600;font-size:12px;}
  td.store{text-align:left;font-weight:700;}
  .ok{color:var(--green);font-weight:700;}
  .no{color:var(--red);font-weight:700;}
  .warn{color:var(--amber);font-weight:700;}
  .mut{color:var(--muted);}
  .meter{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 2px;}
  .meter > span{display:block;height:100%;background:var(--blue);transition:width .4s;}
  .foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.7;}
  .state{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}
  .allgood{background:var(--greenbg);color:var(--green);border-radius:14px;padding:18px;text-align:center;font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← 홈으로</a>
    <button class="refresh" onclick="loadBrief()">↻ 새로고침</button>
  </div>
  <div class="head">
    <div class="kicker">옆커폰 · 대구지사 아침 브리핑</div>
    <div class="title">오늘 놓치면 안 되는 것</div>
    <div class="date" id="date">불러오는 중…</div>
  </div>
  <div id="content"><div class="state">데이터를 불러오는 중이에요…</div></div>
  <div class="foot" id="foot">매일 오전 10시 자동으로 갱신돼요</div>
</div>

<script>
// 매출 = 서버가 매일 계산해 저장한 '브리핑 스냅샷'(briefing/sales_latest) 을 읽음
// 인수인계 = Supabase 실시간
const SB = "https://skhbcizzqgmlnwiwlaxt.supabase.co/rest/v1/kv";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNraGJjaXp6cWdtbG53aXdsYXh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NjI5NTIsImV4cCI6MjEwMDQzODk1Mn0.Ov_4bLIkkxgRb-UG_qSYl_XNM0BbNESOXJl1dFVLfAo";
const H = {apikey:KEY, Authorization:'Bearer '+KEY};

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
const looksTest = s => !s || /^(1+|ㅇ+|3+|test|테스트|ㄴ+|ㅁ+)$/i.test(String(s).trim());
function fmtKST(ts){
  try{ return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(ts)); }catch(e){ return ''; }
}
function fmtDateKo(s){ const t=String(s).split('-'); return t.length>=3 ? `${Number(t[1])}월 ${Number(t[2])}일` : String(s); }

async function loadBrief(){
  document.getElementById('content').innerHTML = '<div class="state">데이터를 불러오는 중이에요…</div>';
  let snap=null, updatedAt=null, handover=[];

  // 매출 스냅샷
  try{
    const r = await fetch(SB+'?select=value,updated_at&namespace=eq.briefing&key=eq.sales_latest',{headers:H});
    const a = await r.json();
    if(a && a[0]){ snap = JSON.parse(a[0].value); updatedAt = a[0].updated_at; }
  }catch(e){}

  // 인수인계 실시간
  try{
    const r = await fetch(SB+'?select=key,value&namespace=eq.handover&key=like.handover:%25',{headers:H});
    const arr = await r.json();
    (arr||[]).filter(x=>!x.key.includes('handover_index')).forEach(x=>{
      let o; try{o=JSON.parse(x.value);}catch(e){return;}
      if(!o||!o.meta) return;
      let all=[],pending=0,total=0,done=0;
      Object.values(o.simple||{}).forEach(v=>{if(Array.isArray(v))all=all.concat(v);});
      all.forEach(it=>{total++; if(it.out&&it.in)done++; else if(it.out&&!it.in)pending++;});
      handover.push({store:o.meta.store||'(무제)',total,done,pending,notStarted:done===0&&pending===0,
        testish:looksTest(o.meta.store)||looksTest(o.meta.outgoing)||looksTest(o.meta.incoming)});
    });
  }catch(e){}

  // 날짜는 항상 '오늘'(한국시간) 기준으로 표시 — 데이터와 무관하게 매일 갱신
  const todayStr = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(new Date());
  const [ty,tm,td] = todayStr.split('-').map(Number);
  const wd = new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',weekday:'short'}).format(new Date());
  const dt = document.getElementById('date');
  dt.textContent = `${ty}년 ${tm}월 ${td}일 (${wd})`;
  const isToday = !!(snap && snap.today === todayStr);
  document.getElementById('foot').innerHTML = (updatedAt? `가장 최근 매출 보고: ${fmtKST(updatedAt)} · ` : '') + '매장 보고가 들어오면 자동으로 반영돼요';

  render(snap, handover, isToday);
}

function render(snap, handover, isToday){
  let html='';
  // 오늘 보고가 없거나(스냅샷이 예전 날짜) 데이터가 없으면 → 옛날 데이터 대신 '특이사항 없음'으로 깔끔 정리
  if(!snap || !snap.stores || !isToday){
    let note;
    if(snap && snap.today && !isToday){
      note = `오늘은 아직 매장 보고가 들어오지 않았어요.<br><span style="font-size:12.5px;color:var(--muted)">가장 최근 보고: ${fmtDateKo(snap.today)} · 새 보고가 들어오면 자동 반영돼요</span>`;
    } else {
      note = `아직 오늘 브리핑 데이터가 없어요.<br><span style="font-size:12.5px;color:var(--muted)">매장이 보고를 입력하면 여기에 표시돼요.</span>`;
    }
    html = `<div class="allgood">✅ 특이사항 없음</div><div class="state">${note}</div>`;
    document.getElementById('content').innerHTML = html + handoverHtml(handover);
    return;
  }
  const stores = snap.stores;
  const unreported = stores.filter(s=>!s.reported).map(s=>s.name);
  const follow = stores.filter(s=>s.note && s.note.trim());
  const notAct = stores.filter(s=>(s.notActivated||0)>0);
  const noPrice = stores.filter(s=>s.reported && s.priceSheet==='미완료').map(s=>s.name);
  const promoShort = stores.filter(s=>s.reported && (s.promoTarget||0)>0 && (s.promoDone||0)<s.promoTarget).map(s=>`${s.name} ${s.promoDone}/${s.promoTarget}`);
  const adMiss = snap.weekdayKey? stores.filter(s=>s.reported && s.adToday===false).map(s=>s.name) : [];
  const reported = stores.filter(s=>s.reported).length;
  const pct = stores.length? Math.round(reported/stores.length*100):0;
  const flags = unreported.length + follow.length + notAct.length + noPrice.length + promoShort.length + (adMiss.length?1:0);

  if(flags===0){
    html += `<div class="allgood">🎉 오늘은 놓친 항목이 없어요! 전 매장 정상.</div>`;
  }else{
    html += `<div class="summary"><b>오늘 꼭 챙길 것 ${flags}가지</b><p>`+
      (unreported.length?`매출 미보고 ${unreported.length}곳, `:'')+
      (follow.length?`고객 후속 연락 ${follow.length}건, `:'')+
      `시세표·프로모션·광고 체크를 확인하세요. 아래 🔴부터 처리하시면 돼요.</p></div>`;
  }

  html += `<div class="card"><h2><span class="dot" style="background:var(--blue)"></span>오늘 매출 보고 현황 &nbsp;<span class="mut" style="font-weight:400">${reported} / ${stores.length} 매장</span></h2>
    <div class="meter"><span style="width:${pct}%"></span></div>
    <div class="mut" style="font-size:12px">${unreported.length? '미보고: '+unreported.map(esc).join(', ') : '전 매장 보고 완료'}</div></div>`;

  let red='';
  if(unreported.length) red += `<div class="item"><span class="tag red">미보고</span><div class="itxt"><b>${unreported.map(esc).join(' · ')}</b> 오늘 매출 보고 미제출</div></div>`;
  follow.forEach(f=>{ red += `<div class="item"><span class="tag red">후속 연락</span><div class="itxt"><b>${esc(f.name)}</b> — ${esc(f.note)}</div></div>`; });
  if(notAct.length) red += `<div class="item"><span class="tag red">미개통</span><div class="itxt">미개통 후속: <b>${notAct.map(s=>esc(s.name)+' '+s.notActivated+'건').join(' · ')}</b></div></div>`;
  if(red) html += `<div class="card"><h2><span class="dot" style="background:var(--red)"></span>🔴 지금 바로 챙기기</h2>${red}</div>`;

  let amb='';
  if(noPrice.length) amb += `<div class="item"><span class="tag amber">시세표</span><div class="itxt"><b>${noPrice.map(esc).join(' · ')}</b> 시세표 미완료</div></div>`;
  if(promoShort.length) amb += `<div class="item"><span class="tag amber">프로모션</span><div class="itxt"><b>${promoShort.map(esc).join(' · ')}</b> 목표 대비 진행 부족</div></div>`;
  if(adMiss.length) amb += `<div class="item"><span class="tag amber">광고 체크</span><div class="itxt">오늘 광고 체크 미완료: <b>${adMiss.map(esc).join(' · ')}</b></div></div>`;
  if(amb) html += `<div class="card"><h2><span class="dot" style="background:var(--amber)"></span>🟡 오늘 중 확인·완료</h2>${amb}</div>`;

  let tr='';
  stores.forEach(s=>{
    if(!s.reported){ tr+=`<tr><td class="store">${esc(s.name)}</td><td class="no">미보고</td><td class="mut">–</td><td class="mut">–</td><td class="mut">–</td><td class="mut">–</td></tr>`; return; }
    const salesCell = (s.sales||0)===0?'<td class="warn">0원</td>':`<td>${(s.sales/10000).toLocaleString()}만원</td>`;
    tr += `<tr><td class="store">${esc(s.name)}</td><td class="ok">✓</td>${salesCell}`+
      (s.priceSheet==='미완료'?'<td class="no">미완료</td>':'<td class="ok">완료</td>')+
      `<td class="${(s.promoDone||0)<(s.promoTarget||0)?'no':'ok'}">${s.promoDone||0}/${s.promoTarget||0}</td>`+
      (snap.weekdayKey? (s.adToday?'<td class="ok">✓</td>':'<td class="no">✕</td>') : '<td class="mut">–</td>')+`</tr>`;
  });
  html += `<div class="card"><h2><span class="dot" style="background:var(--blue)"></span>매장별 한눈에</h2>
    <table><thead><tr><th style="text-align:left">매장</th><th>보고</th><th>매출</th><th>시세표</th><th>프로모션</th><th>광고</th></tr></thead><tbody>${tr}</tbody></table></div>`;

  html += handoverHtml(handover);
  document.getElementById('content').innerHTML = html;
}

function handoverHtml(handover){
  if(!handover || !handover.length) return '';
  let ho='';
  handover.forEach(h=>{
    if(h.testish) ho += `<div class="item"><span class="tag green">정리 권장</span><div class="itxt"><b>'${esc(h.store)}'</b> 테스트로 보이는 항목<div class="sub">실제 건이 아니면 삭제 권장</div></div></div>`;
    else if(h.notStarted) ho += `<div class="item"><span class="tag blue">진행중</span><div class="itxt"><b>${esc(h.store)}</b> 착수 단계 · 항목 미완료</div></div>`;
    else if(h.pending>0) ho += `<div class="item"><span class="tag amber">인수 대기</span><div class="itxt"><b>${esc(h.store)}</b> 완료 ${h.done}/${h.total} · 인수 확인 대기 ${h.pending}건</div></div>`;
    else ho += `<div class="item"><span class="tag green">진행</span><div class="itxt"><b>${esc(h.store)}</b> 완료 ${h.done}/${h.total}</div></div>`;
  });
  return `<div class="card"><h2><span class="dot" style="background:var(--green)"></span>인수인계 진행 상황</h2>${ho}</div>`;
}

loadBrief();
</script>
<script>(function(){try{
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNraGJjaXp6cWdtbG53aXdsYXh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NjI5NTIsImV4cCI6MjEwMDQzODk1Mn0.Ov_4bLIkkxgRb-UG_qSYl_XNM0BbNESOXJl1dFVLfAo', SB='https://skhbcizzqgmlnwiwlaxt.supabase.co/rest/v1/kv';
var H={apikey:KEY, Authorization:'Bearer '+KEY};
var card=document.createElement('section');
card.id='store-brief';
card.style.cssText='background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 18px;margin:14px 0;box-shadow:0 1px 2px rgba(20,20,40,.05)';
card.innerHTML='<div style="font-weight:800;font-size:15px;margin-bottom:9px">🏬 매장분석 특이사항 <span id="sb-ym" style="font-weight:500;color:var(--muted);font-size:12px"></span></div><div id="sb-body" style="font-size:13px;line-height:1.75;color:var(--ink)">불러오는 중…</div><div style="margin-top:10px"><a href="store-manager.html" style="font-size:12px;font-weight:700;color:#6B3FA8;text-decoration:none">매장분석 자세히 보기 →</a></div>';
function place(){var c=document.getElementById('content'); if(c&&c.parentNode){c.parentNode.insertBefore(card,c.nextSibling);} else {document.body.appendChild(card);}}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',place);} else {place();}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
function isActiveAt(s,m){if(!s.status||s.status==='영업중')return true; if(!s.statusDate)return false; return m<String(s.statusDate).slice(0,7);}
function pAt(s,m){var pf=s.perf||[]; for(var i=0;i<pf.length;i++){if(pf[i].ym===m)return pf[i];} return null;}
function gtag(s){return s.gubun==='직영'?'<span style="color:#6B3FA8">[직영]</span>':'<span style="color:#2e9e6b">[가맹]</span>';}
function done(stores){
var body=document.getElementById('sb-body'); if(!body)return;
var mset={}; stores.forEach(function(s){(s.perf||[]).forEach(function(p){if(p.ym)mset[p.ym]=1;});});
var months=Object.keys(mset).sort();
if(!months.length){body.textContent='아직 매출 데이터가 없어요'; return;}
var ym=months[months.length-1], prev=months.length>1?months[months.length-2]:null;
var yl=document.getElementById('sb-ym'); if(yl)yl.textContent='· 기준월 '+ym;
var active=stores.filter(function(s){return isActiveAt(s,ym);});
var moves=[]; active.forEach(function(s){var c=pAt(s,ym), p=prev?pAt(s,prev):null; if(c&&p&&p.sales){moves.push({s:s,d:(c.sales-p.sales)/p.sales*100});}});
var up=moves.filter(function(m){return m.d>=30;}).sort(function(a,b){return b.d-a.d;}).slice(0,4);
var down=moves.filter(function(m){return m.d<=-25;}).sort(function(a,b){return a.d-b.d;}).slice(0,4);
var issues=0; active.forEach(function(s){(s.issues||[]).forEach(function(i){if(i.status!=='완료')issues++;});});
var closed=stores.filter(function(s){return s.status&&s.status!=='영업중';});
var L=[];
if(up.length){L.push('<div>📈 <b>급등</b> '+up.map(function(m){return gtag(m.s)+' '+esc(m.s.name)+' <span style="color:#2e9e6b;font-weight:700">+'+Math.round(m.d)+'%</span>';}).join(' · ')+'</div>');}
if(down.length){L.push('<div>📉 <b>급락 주의</b> '+down.map(function(m){return gtag(m.s)+' '+esc(m.s.name)+' <span style="color:var(--red);font-weight:700">'+Math.round(m.d)+'%</span>';}).join(' · ')+'</div>');}
if(issues){L.push('<div>⚠️ 미해결 이슈 <b>'+issues+'건</b></div>');}
if(closed.length){L.push('<div>🚧 휴업·폐업 '+closed.map(function(s){return esc(s.name)+'('+esc(s.status)+')';}).join(', ')+'</div>');}
if(!L.length){L.push('<div style="color:var(--muted)">특이사항 없음 — 큰 변동 없이 안정적으로 운영 중이에요 👍</div>');}
body.innerHTML=L.join('');
}
fetch(SB+'?select=value&namespace=eq.storemgr&key=eq.data',{headers:H}).then(function(r){return r.json();}).then(function(rows){if(rows&&rows[0]&&rows[0].value){done(JSON.parse(rows[0].value));}else{var b=document.getElementById('sb-body'); if(b)b.textContent='매장 데이터가 비어 있어요';}}).catch(function(e){var b=document.getElementById('sb-body'); if(b)b.textContent='매장분석 자료를 불러오지 못했어요';});
}catch(e){}})();</script>
</body>
</html>
