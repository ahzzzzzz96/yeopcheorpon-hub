<title>백지현 담당 매장 판매실력 분석 · 2026년 5~7월</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f4f4f1;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#006300;
  --seq-100:#cde2fb; --seq-250:#86b6ef; --seq-450:#2a78d6; --seq-600:#184f95;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink-1);
  font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 80px}
header.top{margin-bottom:24px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
h1{font-size:26px;margin:6px 0 4px;letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:13px;margin:0}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:18px}
.card h2{font-size:16px;margin:0 0 2px;letter-spacing:-.01em}
.card .cap{font-size:12.5px;color:var(--ink-2);margin:0 0 18px}
.hero{display:grid;grid-template-columns:minmax(260px,1.05fr) 1fr;gap:26px;align-items:center}
.hero .figure{font-size:60px;font-weight:650;line-height:1;letter-spacing:-.03em;color:var(--crit)}
.hero .flabel{font-size:13px;color:var(--ink-2);margin-top:8px}
.hero .fnote{font-size:12.5px;color:var(--ink-3);margin-top:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--plane);border:1px solid var(--border);border-radius:10px;padding:13px 14px}
.tile .l{font-size:11.5px;color:var(--ink-2);margin-bottom:5px}
.tile .v{font-size:23px;font-weight:640;letter-spacing:-.02em;line-height:1.1}
.tile .d{font-size:11.5px;margin-top:4px;color:var(--ink-3)}
.up{color:var(--good-ink);font-weight:600}.down{color:var(--crit);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.hero{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--grid);stroke-width:1}
.ax{stroke:var(--axis);stroke-width:1}
.tk{font-size:10.5px;fill:var(--ink-3);font-variant-numeric:tabular-nums}
.lb{font-size:11.5px;fill:var(--ink-2)}
.vl{font-size:11px;fill:var(--ink-2);font-variant-numeric:tabular-nums}
.tgt{stroke:var(--crit);stroke-width:2;stroke-linecap:round}
.tgtx{font-size:11px;fill:var(--crit);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:0 0 12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
th{font-size:11px;color:var(--ink-2);font-weight:600;text-align:right;border-bottom:1px solid var(--axis)}
th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
tbody tr:hover{background:var(--plane)}
tfoot td{font-weight:650;border-top:1px solid var(--axis);border-bottom:none;background:var(--plane)}
.pill{display:inline-block;padding:1.5px 8px;border-radius:20px;font-size:11px;font-weight:600;line-height:1.5}
.p-good{background:rgba(12,163,12,.12);color:var(--good-ink)}
.p-warn{background:rgba(250,178,25,.20);color:#8a5c00}
.p-crit{background:rgba(208,59,59,.12);color:var(--crit)}
.p-ser{background:rgba(236,131,90,.18);color:#a8451c}
.spark{width:62px;height:20px;display:inline-block;vertical-align:-4px}
ul.acts{margin:0;padding-left:0;list-style:none}
ul.acts li{padding:11px 0 11px 0;border-bottom:1px solid var(--grid);display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
ul.acts li:last-child{border-bottom:none}
.num{width:22px;height:22px;border-radius:50%;background:var(--s1);color:#fff;font-size:11.5px;font-weight:650;display:grid;place-items:center;margin-top:1px}
.num.r{background:var(--crit)}.num.w{background:#c98500}
ul.acts b{font-size:13px}
ul.acts p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2)}
.kpi-in{width:100%;border-collapse:collapse;font-size:12.5px}
.kpi-in th,.kpi-in td{border:1px solid var(--grid);padding:7px 9px;text-align:center}
.kpi-in th:first-child,.kpi-in td:first-child{text-align:left}
.kpi-in thead th{background:var(--plane);font-size:11px}
.blank{color:var(--ink-3);background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(11,11,11,.035) 5px,rgba(11,11,11,.035) 10px)}
.note{font-size:12px;color:var(--ink-3);margin-top:12px;padding-top:12px;border-top:1px solid var(--grid)}
.kpibar{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:4px}
.kbox{border:1px solid var(--border);border-radius:9px;padding:11px 12px;background:var(--plane)}
.kbox .t{font-size:11.5px;color:var(--ink-2);margin-bottom:4px}
.kbox .r{font-size:13px;font-weight:640}
.kbox.on{background:rgba(12,163,12,.07);border-color:rgba(12,163,12,.3)}
.kbox.off{background:rgba(208,59,59,.05);border-color:rgba(208,59,59,.25)}
.kbox.na{opacity:.6}
.tt{position:fixed;pointer-events:none;background:var(--ink-1);color:#fff;font-size:11.5px;padding:7px 10px;border-radius:7px;opacity:0;transition:opacity .1s;z-index:99;line-height:1.5;white-space:nowrap}
.hit{fill:transparent;cursor:pointer}
</style>
</head>

function b64bytes(s){
  var bin = atob(s), a = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
  return a;
}

YC.guard(async function(me){
  var err = document.getElementById('rp-err');
  try{
    var res = await YC.call('get', {key:'key:'+RP_KEY_ID}, 'reports');
    if(!res || !res.value) throw new Error('열쇠를 찾지 못했습니다.');
    var raw = b64bytes(res.value.trim());
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var blob = b64bytes(RP_DATA);
    var plain = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv: blob.slice(0,12)}, key, blob.slice(12));
    document.getElementById('rp').innerHTML = new TextDecoder().decode(plain);
    document.getElementById('rp-load').remove();
  }catch(e){
    err.textContent = (e && e.message) ? e.message : '자료를 열지 못했습니다.';
  }
});
</script>
