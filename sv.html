  --accent:#f2530f; --accent-soft:#fff1e9;
  --blue:#2354d8; --blue-soft:#e9f0ff;
  --green:#0f9d58; --green-soft:#e6f7ee;
  --red:#e0342b; --red-soft:#fdecea;
  --amber:#c17f00; --amber-soft:#fff5e0;

*{box-sizing:border-box}
body{margin:0;background:#eceef2;color:var(--ink);font-size:13px;
 font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1420px;margin:0 auto;padding:0 14px 14px}
body>.wrap{padding-top:9px}
header{background:#101318;color:#fff;padding:11px 0 0;position:sticky;top:0;z-index:40}
.h-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:15.5px;margin:0;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
h1 .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.h-btns{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.hbtn{background:#20242c;border:1px solid #2d323c;color:#d5d9e0;font-size:11.5px;padding:6px 11px;
 border-radius:7px;cursor:pointer;font-weight:600;font-family:inherit}
.hbtn:hover{background:#2b3039;color:#fff}
.hbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.hbtn.gr{background:#12603a;border-color:#12603a;color:#c8f5dd}
.msel{background:#20242c;border:1px solid #2d323c;color:#fff;font-size:12.5px;font-weight:800;
 padding:6px 9px;border-radius:7px;font-family:inherit;cursor:pointer}
.sv{font-size:11px;color:#7d8593;font-weight:700}
.sv.on{color:#5fd39b} .sv.warn{color:#ffb787}
.tabs{display:flex;gap:2px;margin-top:8px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:#8d939f;font-size:12.5px;
 font-weight:700;padding:8px 12px;cursor:pointer;font-family:inherit}
.tabs button.on{color:#fff;border-bottom-color:var(--accent)}

.chips{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 0;padding-bottom:9px}
#chipbar .chip.on{background:#fff;border-color:#fff;color:#14171c}

.chip{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 9px;cursor:pointer;
 font-size:11.5px;font-weight:800;color:var(--ink2);display:flex;align-items:center;gap:4px;font-family:inherit;
 white-space:nowrap;flex-shrink:0}
.chip:hover{border-color:#b9c0cb}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .b{font-size:9px;background:var(--accent);color:#fff;border-radius:20px;padding:1px 4px;font-weight:800}
.chip{border-left-width:3px}
@media(max-width:1240px){.chip{font-size:11px;padding:6px 7px}}
.chip .cw{font-size:11px;margin-right:-2px}
.lnlab{font-size:10.5px;font-weight:800;border-radius:6px;padding:0 9px;display:flex;align-items:center;
 letter-spacing:-.2px;white-space:nowrap}
.brk{flex-basis:100%;height:0}
.linepill{font-size:10.5px;font-weight:800;border-radius:20px;padding:3px 9px;letter-spacing:-.1px}
.crown{font-size:10.5px;font-weight:800;border-radius:20px;padding:3px 9px;background:#ffd66b;color:#6b4a00}
.ldot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
td .lp{font-size:10px;font-weight:800;border-radius:20px;padding:2px 7px}

.hero{background:linear-gradient(120deg,#191d26,#262d3a);color:#fff;border-radius:11px;
 padding:10px 16px;margin-bottom:8px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hero .hn{font-size:19px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:7px}
.hero .hg{width:20px;height:20px;border-radius:6px;font-size:11px;font-weight:800;display:flex;
 align-items:center;justify-content:center}
.hero .hm{font-size:11px;color:#98a0ae;font-weight:600;margin-top:2px}
.hero .hs{display:flex;gap:22px;flex-wrap:wrap;flex:1}
.hero .hs .l{font-size:10px;color:#8b94a3;font-weight:700}
.hero .hs .v{font-size:17px;font-weight:800;letter-spacing:-.4px;margin-top:1px}
.hero .hs .v small{font-size:10px;color:#98a0ae;font-weight:600;margin-left:1px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.panel+.panel{margin-top:9px}
.ph{padding:8px 13px;font-size:12.5px;font-weight:800;display:flex;justify-content:space-between;
 align-items:center;gap:8px;color:#fff;letter-spacing:-.2px}
.ph .cnt{font-size:10.5px;font-weight:800;background:rgba(255,255,255,.24);border-radius:20px;padding:1px 8px;margin-left:5px}
.ph .add{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:6px;font-size:11px;
 font-weight:800;padding:4px 10px;cursor:pointer;font-family:inherit}
.ph .add:hover{background:rgba(255,255,255,.36)}
.ph.or{background:#f2530f} .ph.bl{background:#2354d8} .ph.gn{background:#0f9d58} .ph.dk{background:#2b3140} .ph.gy{background:#606775}
.pb{padding:4px 13px 9px}

/* 체크리스트형 항목 */
.li{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li .tx{flex:1;font-size:13px;line-height:1.55;font-weight:600;color:var(--ink)}
.li.done .tx{color:#a8aeb9;text-decoration:line-through}
.li .n{font-size:10.5px;font-weight:800;color:#c2c8d2;width:13px;text-align:right;padding-top:3px;flex-shrink:0}
.del{background:none;border:0;color:#ccd1d9;cursor:pointer;font-size:12.5px;padding:0 1px;line-height:1.4}
.del:hover{color:var(--red)}
select.st{border:0;border-radius:20px;font-size:10.5px;font-weight:800;padding:3px 9px;cursor:pointer;
 font-family:inherit;appearance:none;text-align:center;flex-shrink:0;margin-top:1px}
.s완료{background:var(--green-soft);color:var(--green)}
.s진행중{background:var(--blue-soft);color:var(--blue)}
.s미착수{background:#eef0f3;color:#7b8290}
.s보류{background:var(--amber-soft);color:var(--amber)}
.empty{font-size:12px;color:var(--ink3);padding:14px 0;text-align:center}
.ck{width:17px;height:17px;border:2px solid #c9cfd9;border-radius:5px;background:#fff;cursor:pointer;
 flex-shrink:0;margin-top:2px;padding:0;position:relative;transition:.12s}
.ck:hover{border-color:var(--green)}
.ck.on{background:var(--green);border-color:var(--green)}
.ck.on:after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:9px;border:solid #fff;
 border-width:0 2px 2px 0;transform:rotate(43deg)}
.li .dt{font-size:10px;color:#a9b0bb;font-weight:700;flex-shrink:0;margin-top:3px}
.undo{background:none;border:0;color:#b6bcc6;cursor:pointer;font-size:13px;padding:0 2px;line-height:1.4}
.undo:hover{color:var(--blue)}
.note{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;
 font-family:inherit;line-height:1.65;resize:vertical;min-height:62px;outline:none;color:var(--ink2);background:#fcfcfd}
.note:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

[contenteditable]{outline:none;border-radius:4px;padding:0 3px;margin:0 -2px;transition:.1s;min-width:20px;
 display:inline-block}
[contenteditable]:hover{background:#f2f4f7}
[contenteditable]:focus{background:#fff;box-shadow:0 0 0 2px var(--accent-soft),0 0 0 1px var(--accent)}
[contenteditable]:empty:before{content:attr(data-ph);color:#c4cad3;font-weight:500}

/* 정보 표 */

 border-left:0;border-right:0;text-align:left}

.gh.g2 td{background:#fff0e7;color:#b3400c;border-left:3px solid #f2530f}

tr.g2 td.k{background:#fff7f2;color:#8a5031}
tr.g3 td.k{background:#f4f8ff;color:#39518a}

table.big{border-collapse:collapse;width:100%;font-size:12px;min-width:1120px}

 border-bottom:1px solid var(--line);white-space:nowrap;font-size:10.5px}
table.big td{padding:7px 6px;border-bottom:1px solid var(--line2);text-align:center;white-space:nowrap}
table.big tbody tr:hover{background:#fafbfc;cursor:pointer}
table.big td.nm{font-weight:800;text-align:left;padding-left:11px}
.mut{color:var(--ink3);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(10,12,16,.55);display:none;z-index:70;padding:40px 16px;overflow:auto}
.modal.on{display:block}
.mbox{max-width:700px;margin:0 auto;background:#fff;border-radius:14px;padding:20px 22px}
.mbox h3{margin:0 0 6px;font-size:16px}
.mbox p{margin:0 0 11px;font-size:12.5px;color:var(--ink2);line-height:1.7}

 font-size:12.5px;font-family:ui-monospace,Menlo,monospace;outline:none}
.mbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:11px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:13px;font-weight:700;
 padding:8px 15px;border-radius:8px;cursor:pointer;font-family:inherit}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:900px){.cols{grid-template-columns:1fr}

</style>
</head>

  const GC={"실적":"g1","광고":"g2","온라인":"g3"};
  const GL={"실적":"매출 · 실적","광고":"광고비","온라인":"온라인 채널 점검"};
  let last=null;
  const rowHTML=rows.map(([grp,cells])=>{
    let head=""; if(grp!==last){ last=grp;
      head=`<tr class="gh ${GC[grp]}"><td colspan="6">${GL[grp]}</td></tr>`; }
    return head+`<tr class="${GC[grp]}">${cells.join("")}</tr>`; }).join("");
  const B=(k,v)=>`<td class="k">${k}</td><td class="v">${v}</td>`;
  const brows=[
    [B("주소",ed(si,"address",s.address,"주소를 입력하세요")),B("대표 키워드",ed(si,"keywords",s.keywords,"-"))],
    [B("운영 방향성",ed(si,"direction",s.direction,"-")),B("상권 유형",ed(si,"market",s.market,"-"))],
    [B("주요 경쟁사",ed(si,"rival",s.rival,"-")),B("목표 / 직원수",ed(si,"goalStaff",s.goalStaff,"-"))],
    [B("개선 포인트",ed(si,"improve",s.improve,"-")),B("SV 진단",ed(si,"diag",s.diag,"-"))],
  ];
  return `
  <div class="hero">
    <div><div class="hn">${LEADER[s.name]?`<span style="font-size:20px">👑</span>`:""}${esc(s.name)}
        <span class="linepill" style="background:${LN(s).c};color:#fff">${LN(s).n}</span>
        ${g?`<span class="hg" style="background:${gcol(g)}26;color:${gcol(g)}">${g}</span>`:""}</div>
      <div class="hm">${esc(s.region)} · ${esc(s.manager)} 점장 · ${s.staff}인 매장</div></div>
    ${s.group==="공통"?"":`<div class="hs">
      <div><div class="l">${mLabel(dataMonth)} 매출</div><div class="v" id="q-sales">${man(p.sales)}<small>원</small></div></div>
      <div><div class="l">달성률</div><div class="v" id="q-rate">${rate==null?`<span style="font-size:13px;color:#8b94a3">목표 미확정</span>`:`<span style="color:${gcol(g)}">${pctv(rate)}</span>`}</div></div>
      <div><div class="l">판매건수</div><div class="v" id="q-cnt">${n0(p.cnt)}<small>건</small></div></div>
      <div><div class="l">건당단가</div><div class="v" id="q-unit">${man(unit)}<small>원</small></div></div>
      <div><div class="l">네이버 순위</div><div class="v">${c.rank??"-"}<small>위</small></div></div>
      <div><div class="l">광고비/매출</div><div class="v">${ar==null?"-":pctv(ar)}</div></div>
    </div>`}
  </div>

  <div class="cols">
    <div class="panel"><div class="ph bl"><span>할 일 · 진행중 이슈<span class="cnt">${open.length}</span></span>
      <button class="add" onclick="addIssue(${si})">+ 추가</button></div>
      <div class="pb">${open.length?open.map(([x,i])=>liHTML(x,si,i,false)).join("")
        :`<div class="empty">[+ 추가]로 이 매장에서 할 일을 적어주세요.</div>`}
        <textarea class="note" style="margin-top:7px" placeholder="메모 — 점장 통화 내용, 요청사항"
          oninput="M(STORES[${si}]).memo=this.value;mark()">${esc(m.memo||"")}</textarea></div></div>
    <div class="panel"><div class="ph gn"><span>완료<span class="cnt">${done.length}</span></span></div>
      <div class="pb">${done.length?done.map(([x,i])=>liHTML(x,si,i,true)).join("")
        :`<div class="empty">체크하면 이쪽으로 넘어옵니다.</div>`}</div></div>
  </div>

  ${s.group==="공통"?"":`<div class="panel" style="margin-top:9px"><div class="ph dk">${mLabel(dataMonth)} 실적 · 온라인 · 광고 점검${dataMonth!==month?` <span class="cnt">전월 기준</span>`:""}</div>
    <table class="gt"><tbody>${rowHTML}</tbody></table></div>

  <div class="panel" style="margin-top:9px"><div class="ph gy">매장 기본 정보</div>
    <table class="gt gt2"><tbody>${brows.map(r=>`<tr>${r.join("")}</tr>`).join("")}</tbody></table></div>`}`;
}
function issueView(){
  const rows=[];
  STORES.forEach((s,si)=>{ const m=s.months[month]; if(!m)return;
    m.live.forEach((x,i)=>rows.push([s,si,i,x])); });
  if(!rows.length) return `<div class="panel"><div class="empty">${mLabel(month)}에 등록된 할 일이 없습니다.</div></div>`;
  const open=rows.filter(r=>r[3].status!=="완료"), done=rows.filter(r=>r[3].status==="완료");
  const item=([s,si,i,x],d)=>`<div class="li ${d?"done":""}">
    <button class="ck ${d?"on":""}" onclick="toggle(${si},${i})"></button>
    <span class="n" style="width:auto;color:${LN(s).c};font-weight:800;cursor:pointer"
      onclick="tab='store';document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==='store'));cur=${si};render()">${esc(s.name)}</span>
    <span class="tx" contenteditable oninput="setF(${si},'live',${i},'problem',this)">${esc(x.problem||"")}</span>
    ${d?`<span class="dt">${esc(x.doneAt||"")}</span>`:""}
    <button class="del" onclick="delRow(${si},'live',${i})">✕</button></div>`;
  return `<div class="cols">
    <div class="panel"><div class="ph bl">할 일 · 진행중<span class="cnt">${open.length}</span></div>
      <div class="pb">${open.length?open.map(r=>item(r,false)).join(""):`<div class="empty">없음</div>`}</div></div>
    <div class="panel"><div class="ph gn">완료<span class="cnt">${done.length}</span></div>
      <div class="pb">${done.length?done.map(r=>item(r,true)).join(""):`<div class="empty">없음</div>`}</div></div>
  </div>`;
}
function tableView(){
  const h=["매장명","라인","점장","인원","목표","매출","달성률","건수","건당단가","네이버광고","당근광고","광고비합계","광고비/매출","순위","플레이스","파워링크","비즈머니","리뷰","블로그","플친","할일"];
  let T={sales:0,cnt:0,ad:0,goal:0,gsales:0};
  const go=i=>`onclick="tab='store';document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==='store'));cur=${i};render()"`;
  const ord={"공통":-1,"강남":0,"망포":1,"범어":2};
  const body=STORES.map((s,i)=>[s,i]).sort((a,b)=>((ord[a[0].group]??9)-(ord[b[0].group]??9))||((LEADER[b[0].name]?1:0)-(LEADER[a[0].name]?1:0)))
    .map(([s,i])=>{ const m=s.months[dataMonth], mm=s.months[month];
    if(!m) return `<tr ${go(i)}><td class="nm">${LEADER[s.name]?"👑 ":""}${esc(s.name)}</td>
      <td><span class="lp" style="background:${LN(s).bg};color:${LN(s).c}">${LN(s).n.replace("라인","")}</span></td>
      <td>${esc(s.manager)}</td><td>${s.staff}</td><td colspan="17" class="mut">${mLabel(dataMonth)} 데이터 없음</td></tr>`;
    const p=m.perf,c=m.check, adt=(c.adNaver||0)+(c.adDanggeun||0);
    const rate=(p.goal>0&&p.sales!=null)?p.sales/p.goal:null;
    const unit=(p.cnt&&p.sales!=null)?p.sales/p.cnt:null, ar=p.sales?adt/p.sales:null;
    T.sales+=p.sales||0; T.cnt+=p.cnt||0; T.ad+=adt; if(p.goal>0){T.goal+=p.goal;T.gsales+=p.sales||0}
    const open=(mm?mm.live:[]).filter(x=>x.status!=="완료").length;
    const tv=v=>(v===0||v==="0")?"O":(v==null||v===""||v==="."?"-":v);
    return `<tr ${go(i)}><td class="nm">${LEADER[s.name]?"👑 ":""}${esc(s.name)}</td>
      <td><span class="lp" style="background:${LN(s).bg};color:${LN(s).c}">${LN(s).n.replace("라인","")}</span></td>
      <td>${esc(s.manager)}</td><td>${s.staff}</td>
      <td>${p.goal>0?man(p.goal):`<span class="mut">미확정</span>`}</td><td><b>${n0(p.sales)}</b></td>
      <td style="color:${gcol(rate?gradeOf(rate):"")};font-weight:800">${rate==null?"–":pctv(rate)}</td>
      <td>${n0(p.cnt)}</td><td>${n0(unit)}</td><td>${n0(c.adNaver)}</td><td>${n0(c.adDanggeun)}</td>
      <td><b>${n0(adt)}</b></td><td>${ar==null?"-":pctv(ar)}</td><td>${c.rank??"-"}</td>
      <td>${tv(c.place)}</td><td>${tv(c.power)}</td><td>${n0(c.bizmoney)}</td>
      <td>${n0(c.review)}</td><td>${n0(c.blog)}</td><td>${n0(c.plusfriend)}</td>
      <td>${open?`<b style="color:var(--accent)">${open}</b>`:"-"}</td></tr>`; }).join("");
  return `<div class="tablewrap"><table class="big"><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead>
    <tbody>${body}<tr style="background:#fafbfc;font-weight:800"><td class="nm">합계</td><td colspan="3"></td>
    <td>${man(T.goal)}</td><td>${n0(T.sales)}</td><td>${T.goal?pctv(T.gsales/T.goal):"-"}</td><td>${n0(T.cnt)}</td>
    <td>${T.cnt?n0(T.sales/T.cnt):"-"}</td><td colspan="2"></td><td>${n0(T.ad)}</td>
    <td>${T.sales?pctv(T.ad/T.sales):"-"}</td><td colspan="8"></td></tr></tbody></table></div>`;
}
function onMonth(el){
  if(el.value==="__new"){ const ms=months(), last=ms[ms.length-1];
    let y=+last.slice(0,4), mo=+last.slice(5)+1; if(mo>12){mo=1;y++}
    const nm=`${y}-${String(mo).padStart(2,"0")}`;
    const inp=prompt("새로 추가할 달 (YYYY-MM)",nm); if(!inp||!/^\d{4}-\d{2}$/.test(inp)){renderMsel();return}
    STORES.forEach(s=>{ if(s.months[inp])return; const b=blank(), prev=s.months[last];
      if(prev){ b.check={...prev.check,adNaver:null,adDanggeun:null};
        b.live=prev.live.filter(x=>x.status!=="완료").map(x=>({...x})); }
      s.months[inp]=b; });
    month=inp; mark(); render(); return; }
  month=el.value; render();
}
function renderMsel(){ document.getElementById("msel").innerHTML=
  months().map(m=>`<option value="${m}" ${m===month?"selected":""}>${mLabel(m)}</option>`).join("")
  +`<option value="__new">+ 새 달 추가…</option>`; }
document.getElementById("tabs").onclick=e=>{const t=e.target.dataset.t; if(t){tab=t;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t)); render()}};
function render(){ renderMsel(); syncDataMonth();
  document.getElementById("chipbar").innerHTML = chips();
  document.getElementById("body").innerHTML = tab==="store"?storeView():tab==="issue"?issueView():tableView(); }
render();
(function(){
  const m=/[#&]k=([^&]+)/.exec(location.hash||"");
  if(m){ const el=document.getElementById("pwin"); el.value=decodeURIComponent(m[1]); doLogin(); }
  else setTimeout(()=>document.getElementById("pwin").focus(),100);
})();
</script>
</body>
